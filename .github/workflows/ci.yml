name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: |
          npm run lint > lint-output.txt 2>&1 || {
            echo "::error::npm run lint failed:%0A$(sed 's/%/%25/g' lint-output.txt | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat lint-output.txt
            exit 1
          }
          cat lint-output.txt

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
