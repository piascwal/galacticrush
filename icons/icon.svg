      <stop offset="0%" stop-color="#16294a"/>
      <stop offset="100%" stop-color="#16294a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow-2" cx="88%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#241239"/>
      <stop offset="100%" stop-color="#241239" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33e6ff"/>
      <stop offset="55%" stop-color="#00b8d9"/>
      <stop offset="100%" stop-color="#0a4f66"/>
    </linearGradient>
    <linearGradient id="ring-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8ff0c4"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="100%" y2="100%">
