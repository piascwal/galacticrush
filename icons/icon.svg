      <stop offset="45%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff5d3d"/>
    </linearGradient>
    <radialGradient id="planet-sheen" cx="34%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
